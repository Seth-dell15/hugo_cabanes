<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Portfolio</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 40px; background: #f4f4f9; color: #333; }
        header { text-align: center; margin-bottom: 40px; }
        h1 { margin-bottom: 5px; }
        .projects { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <header>
        <h1>Bonjour, je m'appelle Hugo CABANES</h1>
        <p>Bienvenue sur mon portfolio de développeur / créatif !</p>
    </header>
    
    <section>
        <h2>Mes Projets</h2>
        <div class="projects">
            <div class="card">
                <h3>Projet 1</h3>
                <p>Courte description de votre premier projet.</p>
            </div>
        </div>
    </section>
</body>
</html>
